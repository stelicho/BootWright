[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bootwright"
version = "0.1.0"
description = "Automate building and deploying a PXE boot environment on top of iPXE."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.scripts]
bootwright = "BootWright.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
